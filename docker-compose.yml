services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testmind}
      POSTGRES_DB: ${POSTGRES_DB:-testmind}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testmind} -d ${POSTGRES_DB:-testmind}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-TestMind API}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://testmind:testmind@postgres:5432/testmind}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.inference.wandb.ai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash-1017}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-bge-m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      CONFIG_DIR: /srv/config
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      RAW_DIR: /srv/data/raw
    volumes:
      - api_raw:/srv/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_raw:
