[project]
name = "testmind-api"
version = "0.0.0"
description = "TestMind API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "pgvector>=0.3.6",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.34.0",
  "openpyxl>=3.1.5",
  "python-docx>=1.2.0",
]

[project.optional-dependencies]
bge = ["sentence-transformers>=3.3.0"]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.14.0",
  "pytest>=8.3.4",
  "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["sentence_transformers", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
