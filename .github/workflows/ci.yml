name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testmind
          POSTGRES_PASSWORD: testmind
          POSTGRES_DB: testmind_integration
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U testmind -d testmind_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Check
        env:
          TEST_DATABASE_URL: postgresql+psycopg://testmind:testmind@127.0.0.1:${{ job.services.postgres.ports[5432] }}/testmind_integration
        run: make check
      - name: Smoke eval
        env:
          TEST_DATABASE_URL: postgresql+psycopg://testmind:testmind@127.0.0.1:${{ job.services.postgres.ports[5432] }}/testmind_integration
        run: make smoke
