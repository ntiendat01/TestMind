services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testmind}
      POSTGRES_DB: ${POSTGRES_DB:-testmind}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testmind} -d ${POSTGRES_DB:-testmind}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment:
      APP_NAME: ${APP_NAME:-TestMind API}
      DATABASE_URL: ${DATABASE_URL:-postgresql://testmind:testmind@postgres:5432/testmind}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
